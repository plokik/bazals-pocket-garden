name: RC61 validation

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc61-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-validation:
    name: Godot 4.7 headless contracts
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GODOT_RELEASE: 4.7-stable
      GODOT_ARCHIVE: Godot_v4.7-stable_win64.exe.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic visual-diff dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          python -c "from PIL import Image; print('PILLOW_PREFLIGHT=PASSED')"

      - name: Download and verify official Godot 4.7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseBase = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_RELEASE"
          $archivePath = Join-Path $env:RUNNER_TEMP $env:GODOT_ARCHIVE
          $checksumPath = Join-Path $env:RUNNER_TEMP 'SHA512-SUMS.txt'
          $godotRoot = Join-Path $env:RUNNER_TEMP 'godot-4.7'

          Invoke-WebRequest -Uri "$releaseBase/$env:GODOT_ARCHIVE" -OutFile $archivePath
          Invoke-WebRequest -Uri "$releaseBase/SHA512-SUMS.txt" -OutFile $checksumPath

          $escapedArchive = [regex]::Escape($env:GODOT_ARCHIVE)
          $checksumLine = Get-Content -LiteralPath $checksumPath |
            Where-Object { $_ -match "^[0-9a-fA-F]{128}\s+\*?$escapedArchive$" } |
            Select-Object -First 1
          if (-not $checksumLine) {
            throw "Official SHA512-SUMS.txt does not contain $env:GODOT_ARCHIVE"
          }
          $expectedSha512 = ($checksumLine -split '\s+')[0].ToUpperInvariant()
          $actualSha512 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA512).Hash
          if ($actualSha512 -ne $expectedSha512) {
            throw "Godot archive SHA-512 mismatch. Expected $expectedSha512, got $actualSha512"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $godotRoot -Force
          $godot = Get-ChildItem -LiteralPath $godotRoot -Recurse -File -Filter 'Godot_v4.7-stable_win64.exe' |
            Select-Object -First 1
          if (-not $godot) {
            throw 'The verified Godot archive did not contain the expected Windows executable.'
          }
          $reportedVersion = (& $godot.FullName --version 2>&1 | Out-String).Trim()
          if ($reportedVersion -notmatch '^4\.7(?:\.|-)') {
            throw "Expected Godot 4.7, got '$reportedVersion'"
          }

          "HOW_TO_GROW_GODOT=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "GODOT_ARCHIVE_SHA512=$actualSha512"
          Write-Output "GODOT_VERSION=$reportedVersion"

      - name: Run pinned static/headless visual contract and full GDScript gates
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          & .\tools\run_ci_validation.ps1 `
            -GodotPath $env:HOW_TO_GROW_GODOT `
            -PythonPath $python `
            -ExpectedSaveSchema 41 `
            -ExpectedMinimumRegressionTests 6849 `
            -ExpectedVisualCases 54 `
            -ExpectedActiveVisualGates 34 `
            -ExpectedGoldenDigest D799AB4F869DCB13EBE5B6E5CD0C08BFE9FA352D82C4D88315B9CB67B2791DD7

      - name: Preserve complete validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc61-validation-${{ github.run_id }}
          path: |
            .godot/ci/
            .godot/mvp-tests.log
            .godot/asset-import.log
          if-no-files-found: warn
          retention-days: 14
